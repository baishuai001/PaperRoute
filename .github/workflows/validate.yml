name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PaperRoute
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate paper workspaces
        run: |
          paperroute validate workspaces/spp1-tam-jitc
          paperroute validate workspaces/bmc-cancer-2025-gastric-nerve-model

      - name: Check dependency impact
        run: |
          paperroute impact workspaces/spp1-tam-jitc DIR-001
          paperroute impact workspaces/bmc-cancer-2025-gastric-nerve-model DIR-001
